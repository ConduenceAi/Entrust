    <path d="M84 70 L134 52 L184 70 V128 C184 168 158 194 134 206 C110 194 84 168 84 128 Z" fill="none" stroke="#c7f96f" stroke-width="7" stroke-linejoin="round"/>
    <path d="M112 128 L128 144 L158 110" fill="none" stroke="#c7f96f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="118" font-size="62" font-weight="800" fill="#f2f5ee" letter-spacing="-1.5">NEARFirewall</text>
    <text x="222" y="168" font-size="30" font-weight="700" fill="#c7f96f">Let agents pay. Keep the keys.</text>
    <text x="222" y="206" font-size="19" fill="#a3ad9c">Spending rules for AI agents, enforced on-chain on NEAR.</text>
    <text x="222" y="236" font-size="19" fill="#a3ad9c">Subscriptions, payroll, and agent-to-agent purchases in USDC.</text>

    <!-- Outcomes card -->
