    <text x="824" y="90" font-size="15" font-weight="700" fill="#f2f5ee">engineering · asks to pay</text>
    <g font-size="15">
      <rect x="822" y="108" width="306" height="40" rx="10" fill="#1f2b17"/>
      <circle cx="844" cy="128" r="6" fill="#8fd14f"/>
      <text x="860" y="133" fill="#e6ecdf">Newsliquid · 0.5</text>
      <text x="1112" y="133" fill="#8fd14f" text-anchor="end" font-weight="700">Paid</text>
      <rect x="822" y="156" width="306" height="40" rx="10" fill="#2a2614"/>
      <circle cx="844" cy="176" r="6" fill="#e5b84a"/>
      <text x="860" y="181" fill="#e6ecdf">New vendor · 0.3</text>
      <text x="1112" y="181" fill="#e5b84a" text-anchor="end" font-weight="700">Owner approves</text>
      <rect x="822" y="204" width="306" height="40" rx="10" fill="#2c1714"/>
